# Build, vet and test on every pull request and every push to main. The release
# workflow re-runs the tests before it builds, so a green run here is what a
# release tag waits for.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # The race detector needs cgo; the shipped binary does not, and is built below.
      - name: go test -race
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - name: Build static for both target arches
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -o /dev/null .
          done
